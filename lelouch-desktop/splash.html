<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lelouch IPTV Splash</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #03040b;
            background-image: url('../iptv-app/splash_bg.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            user-select: none;
        }

        .border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid #00d9ff;
            pointer-events: none;
        }

        .iptv-tag {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #9696b4;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .crown {
            margin-top: 50px;
            width: 80px;
            height: auto;
        }

        .title {
            font-size: 48px;
            font-weight: 800;
            margin: 0;
            margin-top: -10px;
            letter-spacing: 2px;
            color: #f8faff;
        }

        .subtitle {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #bd65ff;
            margin-top: -5px;
        }

        .progress-container {
            position: absolute;
            bottom: 120px;
            width: 480px;
            height: 4px;
            border: 1px solid rgba(0, 217, 255, 0.3);
            background: rgba(40, 40, 60, 0.5);
            border-radius: 2px;
            overflow: visible;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0064ff, #00d9ff);
            border-radius: 2px;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-glow {
            position: absolute;
            right: -20px;
            top: -18px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(0,217,255,0.8) 0%, rgba(0,217,255,0) 70%);
            border-radius: 50%;
        }

        .status-text {
            position: absolute;
            bottom: 90px;
            font-size: 12px;
            color: #c8c8dc;
        }

        .percentage {
            position: absolute;
            bottom: 65px;
            font-size: 12px;
            font-weight: bold;
            color: #00d9ff;
        }

        .icons {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 60px;
            font-size: 11px;
            color: #646482;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="border"></div>
    <div class="iptv-tag">▷ IPTV</div>

    <!-- Símbolo de Corona en SVG -->
    <svg class="crown" viewBox="0 0 100 50" fill="none" stroke="#bd65ff" stroke-width="2" stroke-linejoin="round">
        <path d="M20,40 L10,10 L35,30 L50,5 L65,30 L90,10 L80,40 Z" />
    </svg>

    <h1 class="title">LELOUCH</h1>
    <div class="subtitle">REPRODUCTOR IPTV</div>

    <div class="progress-container">
        <div class="progress-bar" id="bar">
            <div class="progress-glow"></div>
        </div>
    </div>

    <div class="status-text" id="status">Inicializando núcleo...</div>
    <div class="percentage" id="pct">0%</div>

    <div class="icons">
        <span>📺 TV</span>
        <span>🎬 PELÍCULAS</span>
        <span>🎞️ SERIES</span>
        <span>⭐ FAVORITOS</span>
    </div>

    <script>
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');
        const pct = document.getElementById('pct');

        const stages = [
            { p: 15, msg: "Inicializando núcleo..." },
            { p: 40, msg: "Preparando servicios multimedia..." },
            { p: 70, msg: "Estableciendo túneles de red..." },
            { p: 90, msg: "Desplegando interfaz..." },
            { p: 99, msg: "Finalizando inicialización..." },
            { p: 100, msg: "Sistema preparado" }
        ];

        let currentStage = 0;
        let progress = 0;
        
        function updateProgress() {
            if (currentStage >= stages.length) return;
            
            const target = stages[currentStage].p;
            const msg = stages[currentStage].msg;
            
            if (progress < target) {
                progress += (target - progress) * 0.05 + 0.1;
                if (progress > target) progress = target;
                
                bar.style.width = progress + '%';
                status.innerText = msg;
                pct.innerText = Math.floor(progress) + '%';
            } else {
                currentStage++;
            }
            
            requestAnimationFrame(updateProgress);
        }

        requestAnimationFrame(updateProgress);
    </script>
</body>
</html>
